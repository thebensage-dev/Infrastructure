# Weekly PRs for newer image tags, one grouped PR per ecosystem. Read the release notes before
# merging. Prometheus stays on its 3.13 LTS line, Node on its LTS major, and PostgreSQL on 16;
# authentik is pinned to an exact release and upgrades only one minor line at a time (e.g.
# 2026.8 -> 2026.11), so never skip a line when merging. No npm here: the authentik Dockerfile
# only installs sharp (pinned there) in its build stage.
version: 2
updates:
  # FROM lines in the Dockerfiles (Prometheus, Grafana, blackbox exporter, Loki, Alloy, authentik
  # and the Node stage that renders its branding).
  - package-ecosystem: docker
    directories:
      - /monitoring/prometheus
      - /monitoring/grafana
      - /monitoring/blackbox
      - /monitoring/loki
      - /monitoring/alloy
      - /identity/authentik
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # The LTS line: only its patch releases.
      - dependency-name: prom/prometheus
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node 26 is the LTS; odd majors are never LTS. Move with the other repos' .nvmrc, by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker-images:
        patterns: ["*"]

  # image: lines in the compose files (node-exporter, cAdvisor, authentik's PostgreSQL, and the
  # local stack's Caddy).
  - package-ecosystem: docker-compose
    directories:
      - /monitoring
      - /identity
      - /local
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # A new PostgreSQL major version needs a dump and restore of authentik's data, never a tag bump.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/coolify-deploy
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
