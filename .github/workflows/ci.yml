name: CI

# One pipeline, run top to bottom. Every PR and every push to main runs job 1; pushes to main
# (and manual runs) carry on through the rest:
#   1. Check                    workflows and scripts lint clean, both compose files resolve,
#                               Prometheus' config parses and every image builds
#   2. Find the changed stacks  identity/, monitoring/ or sites.yml (or the stack picked by hand)
#   3. Check Coolify is ready   DOMAIN is set and Coolify answers; otherwise 4 is skipped
#   4. Deploy to Coolify        the changed stacks, after your approval (the "production" environment)
#   5. Redeploy the sites       manual runs with the box ticked: starts each site's own pipeline
# Until DOMAIN is set and Coolify answers, deploys are skipped, so the run stays green.
on:
  pull_request:
  push:
    branches: [main]
  # Actions > CI > Run workflow (on main): redeploy one stack, or both, without a new commit.
  workflow_dispatch:
    inputs:
      stack:
        description: Which stack to deploy
        type: choice
        options: [both, identity, monitoring, none]
        default: both
      deploy_sites:
        description: Also redeploy the sites in sites.yml afterwards (each asks for its own approval)
        type: boolean
        default: false

# Only PR runs are cancelled by a newer push. Runs on main never queue behind each other, so a
# deploy waiting for approval doesn't hold up the next push's check.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. Check ----------------------------------------------------------------------------------
  check:
    # Keep this name: the "Protect main" ruleset requires a check called "Check".
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Placeholders for the variables the compose files require. The real values come from the
    # production environment in the deploy job (or are generated by Coolify).
    env:
      SERVICE_PASSWORD_64_AUTHENTIKSECRET: ci-placeholder
      SERVICE_PASSWORD_64_AUTHENTIKDB: ci-placeholder
      SERVICE_PASSWORD_AKADMIN: ci-placeholder
      SERVICE_PASSWORD_GRAFANAADMIN: ci-placeholder
      USER_DIRECTORY_URL: https://users.example.com
      API_URL: https://api.example.com
      MAIN_SITE_URL: https://example.com
      GRAFANA_URL: https://grafana.example.com
      GRAFANA_OIDC_CLIENT_SECRET: ci-placeholder
      USER_DIRECTORY_OIDC_CLIENT_SECRET: ci-placeholder
      PORTFOLIO_OIDC_CLIENT_SECRET: ci-placeholder
      MONITORED_SITES: https://example.com
      SMTP_HOST: smtp.example.com
      SMTP_USERNAME: ci
      SMTP_PASSWORD: ci-placeholder
      ALERT_EMAIL_FROM: alerts@example.com
      ALERT_EMAIL_TO: you@example.com
    # Quick checks first, the slow image builds last.
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      # actionlint also runs shellcheck on every run: block.
      - name: Lint the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Lint the shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0 \
            .github/actions/coolify-deploy/deploy.sh monitoring/prometheus/entrypoint.sh monitoring/grafana/share-status.sh
      - name: Check the identity compose file
        run: docker compose -f identity/compose.yaml config --quiet
      - name: Check the monitoring compose file
        run: docker compose -f monitoring/compose.yaml config --quiet
      - name: Check the Prometheus config
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/monitoring/prometheus/prometheus.yml:/prometheus.yml:ro" \
            "$(grep -m1 '^FROM' monitoring/prometheus/Dockerfile | cut -d' ' -f2)" \
            check config /prometheus.yml
      # Downloads SharedUI's brand/ files from its release tag (SHAREDUI_REF in the Dockerfile).
      - name: Build the identity images (authentik)
        run: docker compose -f identity/compose.yaml build
      - name: Build the monitoring images
        run: docker compose -f monitoring/compose.yaml build

  # 2. Find the changed stacks ----------------------------------------------------------------
  # Which stacks to deploy: the folders this push changed, or the stack picked in a manual run.
  changes:
    name: Find the changed stacks
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      identity: ${{ steps.diff.outputs.identity }}
      monitoring: ${{ steps.diff.outputs.monitoring }}
    steps:
      - name: Check out the code (full history, to compare with the last push)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare with the last push
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          STACK: ${{ inputs.stack }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$STACK" in both | identity) echo "identity=true" >> "$GITHUB_OUTPUT" ;; esac
            case "$STACK" in both | monitoring) echo "monitoring=true" >> "$GITHUB_OUTPUT" ;; esac
            exit 0
          fi
          # A first push or a force push has no usable "before": deploy both.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "identity=true" >> "$GITHUB_OUTPUT"
            echo "monitoring=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if grep -q "^identity/" <<<"$changed"; then echo "identity=true" >> "$GITHUB_OUTPUT"; fi
          if grep -qE "^monitoring/|^sites.yml$" <<<"$changed"; then echo "monitoring=true" >> "$GITHUB_OUTPUT"; fi
          echo "Changed: $(tr '\n' ' ' <<<"$changed")"

  # 3. Check Coolify is ready -----------------------------------------------------------------
  # The same gate in every repo. Deploys need DOMAIN and a Coolify that answers at
  # coolify.<DOMAIN> (or COOLIFY_URL). Without them the deploy job is skipped instead of failing,
  # so pushes before go-live stay green and don't ask for an approval.
  ready:
    name: Check Coolify is ready
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.coolify.outputs.deploy }}
    steps:
      - name: Ask Coolify whether it's up
        id: coolify
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
        run: |
          if [ -z "$DOMAIN" ] && [ -z "$COOLIFY_URL" ]; then
            echo "::notice::Deploy skipped: the DOMAIN variable isn't set yet."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url=${COOLIFY_URL:-https://coolify.$DOMAIN}
          if curl --silent --fail --max-time 15 "${url%/}/api/health" >/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Deploy skipped: Coolify didn't answer at $url. Fine before go-live; after it, check Coolify is up."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  # 4. Deploy to Coolify ----------------------------------------------------------------------
  # Waits for your approval (the "production" environment's required reviewer). Coolify builds
  # each stack from this exact commit. Values: DOMAIN, COOLIFY_TOKEN, PLATFORM_SECRET and the
  # email settings (SMTP_* and ALERT_EMAIL_*); everything else is worked out below.
  deploy:
    name: Deploy to Coolify
    needs: [changes, ready]
    if: >-
      needs.ready.outputs.deploy == 'true' &&
      (needs.changes.outputs.identity == 'true' || needs.changes.outputs.monitoring == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DOMAIN: ${{ vars.DOMAIN }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      # Optional override; by default Coolify is https://coolify.<DOMAIN>.
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      # derive:<label> values below become HMAC-SHA256(PLATFORM_SECRET, label). UserDirectory's
      # pipeline derives the same client secret from the same label.
      PLATFORM_SECRET: ${{ secrets.PLATFORM_SECRET }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      # Fails early with a clear message, instead of a Coolify deploy failing on a missing value.
      # Unlike the sites' pipelines this fails rather than skips: these stacks need every value.
      - name: Check the deploy secrets are set
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
        run: |
          missing=""
          for v in COOLIFY_TOKEN PLATFORM_SECRET SMTP_HOST SMTP_PORT SMTP_USE_TLS SMTP_USERNAME SMTP_PASSWORD ALERT_EMAIL_FROM ALERT_EMAIL_TO; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these GitHub values first (see the README, Deploying):$missing"
            exit 1
          fi
      # Order matters on a first deploy: Grafana signs in through authentik.
      - name: Deploy identity (authentik)
        if: needs.changes.outputs.identity == 'true'
        uses: ./.github/actions/coolify-deploy
        env:
          APP_NAME: identity
          APP_UUID: ${{ vars.COOLIFY_IDENTITY_UUID }}
          APP_ENV_GRAFANA_URL: https://grafana.${{ vars.DOMAIN }}
          APP_ENV_USER_DIRECTORY_URL: https://users.${{ vars.DOMAIN }}
          APP_ENV_API_URL: https://api.${{ vars.DOMAIN }}
          APP_ENV_MAIN_SITE_URL: https://${{ vars.DOMAIN }}
          APP_ENV_GRAFANA_OIDC_CLIENT_SECRET: derive:grafana-oidc
          APP_ENV_USER_DIRECTORY_OIDC_CLIENT_SECRET: derive:user-directory-oidc
          APP_ENV_PORTFOLIO_OIDC_CLIENT_SECRET: derive:portfolio-oidc
          APP_ENV_AUTHENTIK_BOOTSTRAP_EMAIL: ${{ vars.ALERT_EMAIL_TO }}
          # Access-request emails, through the same SMTP account as Grafana's alerts.
          APP_ENV_ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          APP_ENV_ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          APP_ENV_SMTP_HOST: ${{ vars.SMTP_HOST }}
          APP_ENV_SMTP_PORT: ${{ vars.SMTP_PORT }}
          APP_ENV_SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          APP_ENV_SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          APP_ENV_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      # Grafana checks every URL listed in sites.yml.
      - name: Read the site checks from sites.yml
        if: needs.changes.outputs.monitoring == 'true'
        id: sites
        run: |
          urls=$(yq -r '[.sites[].checks[], .platform_checks[]] | join(",")' sites.yml)
          echo "monitored=${urls//"{domain}"/$DOMAIN}" >> "$GITHUB_OUTPUT"
          # The public "Live status" token, worked out from DOMAIN exactly as in Portfolio's pipeline.
          echo "status_token=$(printf 'status:%s' "$DOMAIN" | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - name: Deploy monitoring (Grafana, Prometheus, Loki)
        if: needs.changes.outputs.monitoring == 'true'
        uses: ./.github/actions/coolify-deploy
        env:
          APP_NAME: monitoring
          APP_UUID: ${{ vars.COOLIFY_MONITORING_UUID }}
          APP_ENV_GRAFANA_URL: https://grafana.${{ vars.DOMAIN }}
          APP_ENV_AUTHENTIK_URL: https://id.${{ vars.DOMAIN }}
          APP_ENV_GRAFANA_OAUTH_ENABLED: "true"
          APP_ENV_GRAFANA_DISABLE_LOGIN_FORM: ${{ vars.GRAFANA_DISABLE_LOGIN_FORM }}
          APP_ENV_STATUS_ACCESS_TOKEN: ${{ steps.sites.outputs.status_token }}
          APP_ENV_GRAFANA_OIDC_CLIENT_SECRET: derive:grafana-oidc
          APP_ENV_MONITORED_SITES: ${{ steps.sites.outputs.monitored }}
          APP_ENV_ALERT_EMAIL_FROM: ${{ vars.ALERT_EMAIL_FROM }}
          APP_ENV_ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
          APP_ENV_SMTP_HOST: ${{ vars.SMTP_HOST }}
          APP_ENV_SMTP_PORT: ${{ vars.SMTP_PORT }}
          APP_ENV_SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          APP_ENV_SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

  # 5. Redeploy the sites ---------------------------------------------------------------------
  # Manual runs only, when "Also redeploy the sites" is ticked: starts the pipeline of every site
  # in sites.yml on its main branch, e.g. after rebuilding the server. Each site builds its own
  # image and asks for its own approval. Needs the SITES_DISPATCH_TOKEN secret: a fine-grained
  # token with "Actions: Read and write" on those repos (GITHUB_TOKEN can't start workflows in
  # other repos).
  deploy-sites:
    name: Redeploy the sites
    needs: [changes, deploy]
    # Runs after the platform deploy, or straight away when no stack was picked ("none").
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.deploy_sites &&
      needs.changes.result == 'success' && needs.deploy.result != 'failure' && needs.deploy.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
      - name: Start each site's CI on main
        env:
          GH_TOKEN: ${{ secrets.SITES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the SITES_DISPATCH_TOKEN secret to the production environment first."
            exit 1
          fi
          for repo in $(yq -r '.sites[].repo' sites.yml); do
            gh workflow run ci.yml -R "$repo" --ref main
            echo "Started $repo: https://github.com/$repo/actions"
          done
