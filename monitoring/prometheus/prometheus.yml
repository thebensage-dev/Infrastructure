# Prometheus scrape configuration. Service names (grafana, node-exporter...) resolve
# inside the stack's private network. Sites come from MONITORED_SITES via entrypoint.sh.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # Each site, probed through the blackbox exporter.
  - job_name: sites
    metrics_path: /probe
    scrape_interval: 60s
    params:
      module: [http_site]
    file_sd_configs:
      - files: [/tmp/targets/*.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]

  # The monitoring components themselves, so "up == 0" can alert if one stops.
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: blackbox
    static_configs:
      - targets: [blackbox-exporter:9115]
