# Where alerts go. ALERT_EMAIL_TO is set in Coolify (several addresses: separate with ";").
apiVersion: 1
contactPoints:
  - orgId: 1
    name: Email
    receivers:
      - uid: email-admins
        type: email
        settings:
          addresses: ${ALERT_EMAIL_TO}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: Email
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
