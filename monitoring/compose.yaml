# Monitoring stack: Prometheus (metrics) + Loki (logs) + Grafana (dashboards, alerts, sign-in).
# Deploy as its own Coolify app (Docker Compose build pack, base directory /monitoring).
# Only Grafana gets a domain in Coolify: https://grafana.<your-domain>:3000
# (the :3000 is the container port Coolify's proxy forwards to, not a public port).
# Prometheus, Loki and the helpers have no domain and no published ports: they are reachable
# only inside this stack's private network.
#
# The three exporters are small helpers that Prometheus reads from:
#   blackbox-exporter: checks each site over HTTPS (up/down, response time, TLS expiry)
#   node-exporter:     the VPS itself (CPU, memory, disk, network)
#   cadvisor:          each container (CPU and memory per app)
# Alloy collects every container's logs (stdout/stderr) and sends them to Loki.
services:
  grafana:
    # The image bakes in the data source, alert rules and dashboards from ./grafana.
    build: ./grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:?set GRAFANA_URL}
      GF_SECURITY_ADMIN_USER: admin
      # Break-glass local admin. Coolify generates it (a "magic" variable, shown under the app's
      # Environment Variables); store it in your password manager.
      GF_SECURITY_ADMIN_PASSWORD: ${SERVICE_PASSWORD_GRAFANAADMIN}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Set to "true" once authentik sign-in works, so the password form disappears.
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-false}
      # Optional: 32 lowercase hex characters. On every start the "Live status" dashboard is made
      # public at $GRAFANA_URL/public-dashboards/<this> (grafana/share-status.sh), the link the
      # main site's footer uses (its STATUS_URL). Not a secret: the link is public anyway.
      STATUS_ACCESS_TOKEN: ${STATUS_ACCESS_TOKEN:-}

      # Sign-in through authentik (OIDC). The "grafana" client is created by authentik's
      # blueprint (../identity), which also lets in only these groups:
      #   grafana-admins, authentik Admins -> Admin (edit dashboards, alerts, users)
      #   grafana-viewers                  -> Viewer (read-only)
      #   anyone else                      -> refused by authentik
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OAUTH_ENABLED:-true}
      GF_AUTH_GENERIC_OAUTH_NAME: authentik
      # Single sign-on: opening Grafana goes straight to authentik, which signs in anyone who
      # already has an authentik session with no click. The break-glass password form is still at
      # /login?disableAutoLogin=true (while GRAFANA_DISABLE_LOGIN_FORM isn't "true").
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${AUTHENTIK_URL:-}/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${AUTHENTIK_URL:-}/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: ${AUTHENTIK_URL:-}/application/o/userinfo/
      # Signing out of Grafana also ends the authentik session.
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${AUTHENTIK_URL:-}/application/o/grafana/end-session/
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "(contains(groups[*], 'grafana-admins') || contains(groups[*], 'authentik Admins')) && 'Admin' || contains(groups[*], 'grafana-viewers') && 'Viewer' || ''"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"

      # Email for alert notifications (any SMTP service).
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}:${SMTP_PORT:-587}
      GF_SMTP_USER: ${SMTP_USERNAME:?set SMTP_USERNAME}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${ALERT_EMAIL_FROM:?set ALERT_EMAIL_FROM}
      GF_SMTP_FROM_NAME: VPS monitoring
      # Used by grafana/provisioning/alerting/contact-points.yaml
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?set ALERT_EMAIL_TO}
    expose:
      - "3000"
    volumes:
      # Persistent volume: users, sessions, alert state, anything you edit in the UI.
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  prometheus:
    # The image bakes in prometheus.yml; the sites to check come from MONITORED_SITES.
    build: ./prometheus
    restart: unless-stopped
    environment:
      MONITORED_SITES: ${MONITORED_SITES:?set MONITORED_SITES}
      PROMETHEUS_RETENTION_TIME: ${PROMETHEUS_RETENTION_TIME:-30d}
      PROMETHEUS_RETENTION_SIZE: ${PROMETHEUS_RETENTION_SIZE:-5GB}
    expose:
      - "9090"
    volumes:
      # Persistent volume: metric history.
      - prometheus_data:/prometheus

  blackbox-exporter:
    build: ./blackbox
    restart: unless-stopped
    expose:
      - "9115"

  node-exporter:
    image: prom/node-exporter:v1.13.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    expose:
      - "9100"
    volumes:
      # Read-only view of the host filesystem, for disk usage.
      - /:/host:ro,rslave

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      # Skip metric families nobody looks at, to keep Prometheus small.
      - --disable_metrics=percpu,sched,tcp,udp,hugetlb,referenced_memory,cpu_topology,resctrl,advtcp,process
    expose:
      - "8080"
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  loki:
    # Stores the container logs; Grafana searches them (Explore > Loki, or the dashboard).
    build: ./loki
    restart: unless-stopped
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-14d}
    expose:
      - "3100"
    volumes:
      # Persistent volume: log history.
      - loki_data:/loki

  alloy:
    # Reads every container's logs from Docker and sends them to Loki.
    build: ./alloy
    restart: unless-stopped
    expose:
      - "12345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Remembers how far it has read, so a restart doesn't resend old lines.
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  alloy_data:
